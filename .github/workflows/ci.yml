name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cpal (voice audio) needs the ALSA headers on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p plume-tui --no-default-features --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Some DAVE tests feed garbage to openmls, which only debug-asserts in debug builds.
      - run: cargo test -p plume-voice --release --locked

  build:
    name: build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static (musl), so it runs on any Linux distribution. No voice:
          # audio needs the system's ALSA library.
          - name: linux-x86_64
            os: ubuntu-latest
            exe: plume-tui
            target: x86_64-unknown-linux-musl
            flags: --no-default-features
          # With voice. Built on an older Ubuntu so it runs on older glibc.
          - name: linux-x86_64-voice
            os: ubuntu-22.04
            exe: plume-tui
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            exe: plume-tui.exe
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            exe: plume-tui
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: contains(matrix.target, 'linux-gnu')
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release --locked -p plume-tui --target ${{ matrix.target }} ${{ matrix.flags }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" dist/
          cp README.md LICENSE dist/
          size=$(wc -c < "target/${{ matrix.target }}/release/${{ matrix.exe }}")
          echo "### plume-tui (${{ matrix.name }}): $((size / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: plume-tui-${{ matrix.name }}
          path: dist/
          retention-days: 30
