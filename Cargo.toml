[workspace]
resolver = "3"
members = [
    "crates/plume-core",
    "crates/plume-gateway",
    "crates/plume-rest",
    "crates/plume-markdown",
    "crates/plume-auth",
    "crates/plume-notify",
    "crates/plume-voice",
    "crates/plume-tui",
]

# Shared settings every crate inherits with `version.workspace = true` etc.
[workspace.package]
version = "0.1.0"
edition = "2024"

# One place to pin versions; crates opt in with `name.workspace = true`.
[workspace.dependencies]
plume-core = { path = "crates/plume-core" }
plume-gateway = { path = "crates/plume-gateway" }
plume-auth = { path = "crates/plume-auth" }
plume-rest = { path = "crates/plume-rest" }
plume-markdown = { path = "crates/plume-markdown" }
plume-notify = { path = "crates/plume-notify" }

base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.29", features = ["event-stream"] }
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
keyring = "4.2"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
# Only the `ring` crypto backend, so rustls can pick it automatically.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1.53", default-features = false }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

# Tuned for size: opt-level "z" + panic=abort takes the TUI from 8.3 MB to
# 5.3 MB. The heavy-READY benchmark costs ~7 ms more per connect, which is
# not noticeable. `ratatui::init` restores the terminal before aborting.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# RSA key generation is painfully slow unoptimised, even in debug builds.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
